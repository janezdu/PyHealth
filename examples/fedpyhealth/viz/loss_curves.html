  const W=1000,H=opts.h||360,P={t:16,r:opts.r||150,b:46,l:64};
  const all=series.flatMap(s=>s.v).filter(v=>v>0);
  const lo=Math.min(...all), hi=Math.max(...all);
  const nx=Math.max(...series.map(s=>s.v.length));
  const l0=Math.log10(lo), l1=Math.log10(hi);
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const X=i=>P.l+(nx<2?iw/2:i/(nx-1)*iw);
  const Y=v=>P.t+ih-(Math.log10(Math.max(v,lo))-l0)/(l1-l0||1)*ih;
  let g="";
  for(let e=Math.floor(l0);e<=Math.ceil(l1);e++){
    const val=Math.pow(10,e); if(val<lo*0.9||val>hi*1.1)continue;
    g+=`<line class="grid" x1="${P.l}" x2="${P.l+iw}" y1="${Y(val)}" y2="${Y(val)}"/>`;
    g+=`<text class="tick" x="${P.l-8}" y="${Y(val)+4}" text-anchor="end">${val<0.001?val.toExponential(0):val}</text>`;
  }
  if(opts.hline!=null&&opts.hline>=lo&&opts.hline<=hi){
    g+=`<line x1="${P.l}" x2="${P.l+iw}" y1="${Y(opts.hline)}" y2="${Y(opts.hline)}" `+
       `stroke="${cssv('--warn')}" stroke-width="1.4" stroke-dasharray="7 4" stroke-opacity=".7"/>`;
    g+=`<text class="tick" x="${P.l+iw+8}" y="${Y(opts.hline)+4}" fill="${cssv('--warn')}">${opts.hlabel}</text>`;
  }
  for(const s of series){
    const d=s.v.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    g+=`<path d="${d}" fill="none" stroke="${cssv(s.css)}" stroke-width="${s.w||1.8}" `+
       `stroke-opacity="${s.o==null?1:s.o}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.label){
      const ly=Y(s.v[s.v.length-1]);
      g+=`<text class="tick" x="${P.l+iw+8}" y="${ly+4}" fill="${cssv(s.css)}">${s.label}</text>`;
    }
  }
  g+=`<line class="axis" x1="${P.l}" x2="${P.l+iw}" y1="${P.t+ih}" y2="${P.t+ih}"/>`;
  g+=`<line class="axis" x1="${P.l}" x2="${P.l}" y1="${P.t}" y2="${P.t+ih}"/>`;
  const ticks=nx<=12?[...Array(nx).keys()]:[0,Math.floor(nx/4),Math.floor(nx/2),Math.floor(3*nx/4),nx-1];
  for(const i of ticks)
    g+=`<text class="tick" x="${X(i).toFixed(1)}" y="${P.t+ih+18}" text-anchor="middle">${i+1}</text>`;
  g+=`<text class="lab" x="${P.l+iw/2}" y="${H-8}" text-anchor="middle">${opts.xlab}</text>`;
  g+=`<text class="lab" transform="translate(16,${P.t+ih/2}) rotate(-90)" text-anchor="middle">training loss (log)</text>`;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=g;
}

/* ---------- stage 1 ---------- */
const REGS=Object.keys(S1);
REGS.forEach(r=>$("s1reg").insertAdjacentHTML("beforeend",`<option value="${r}">${r}</option>`));
$("s1reg").value=REGS.includes("fedavg")?"fedavg":REGS[0];
function drawS1(){
  const reg=$("s1reg").value, S=S1[reg];
  const keys=Object.keys(S).filter(k=>!k.includes("round_mean"));
  const ramp=["--g1","--g2","--g3","--g4","--real","--warn","--ok","--ink-3"];
  const series=keys.map((k,i)=>({v:S[k].v,css:ramp[i%ramp.length],
    label:k.split(":")[1],w:k.startsWith("finetune")?2.4:1.6,
    o:k.startsWith("finetune")?1:.85}));
  const mean=S["federated:round_mean"];
  if(mean) series.push({v:mean.v,css:"--ink",w:2.6,label:"round mean"});
  plot($("s1"),series,{xlab:reg==="local"?"epoch":"local epoch (across rounds)",h:340});
  const drops=keys.map(k=>S[k].tail_drop);
  const worst=Math.max(...drops);
  $("s1note").innerHTML=`<b>${reg}</b>: over the final fifth of training the loss `+
    `still fell by ${f2(Math.min(...drops))}–${f2(worst)}% depending on the site. `+
    (worst<3?`Effectively flat — the generators finished learning.`
           :`The steepest site was still descending, so this regime had not fully settled.`)+
    (S["finetune:420"]?` Thick lines are the per-hospital fine-tuning phase, which runs after the federated rounds.`:``);
  $("s1leg").innerHTML=series.map(s=>
    `<span><i style="background:${cssv(s.css)}"></i>${s.label||""}</span>`).join("");
}
$("s1reg").addEventListener("change",drawS1);

/* ---------- stage 2 ---------- */
function drawS2(){
  const fams=FAM_ORDER.filter(f=>S2[f]);
  const series=fams.map(f=>({v:S2[f].mean,css:FAM_COLOR[f]||"--ink-3",label:f.replace("tstr:",""),w:2.4}));
  plot($("s2"),series,{xlab:"epoch",h:330,hline:M.base_rate_bce,hlabel:"base-rate loss"});
  $("s2leg").innerHTML=fams.map(f=>
    `<span><i style="background:${cssv(FAM_COLOR[f]||'--ink-3')}"></i>${f.replace("tstr:","")} `+
    `<span class="mono">(${S2[f].n_classifiers})</span></span>`).join("");
  const syn=fams.filter(f=>f.startsWith("tstr:")), real=fams.filter(f=>!f.startsWith("tstr:"));
  const m=a=>a.reduce((s,f)=>s+S2[f].tail_drop,0)/a.length;
  $("s2note").innerHTML=`<b>The synthetic arms finished; the real baselines did not.</b> `+
    `Over their last three epochs the synthetic arms fell ${f2(m(syn))}% on average, `+
    `the real-data baselines ${f2(m(real))}%. Training was cut at ${M.stage2_epochs} epochs for all of `+
    `them, so the baselines were stopped mid-descent — and they are exactly what the `+
    `synthetic arms are being compared against, which biases the comparison toward `+
    `synthetic. The dashed line is the loss of a model that simply predicts the base `+
    `rate; everything sits below it, so nothing collapsed outright.`;
}

/* ---------- table ---------- */
function drawTable(){
  $("thead").innerHTML=["series","stage","curves","records","final loss","tail drop","verdict"]
    .map(h=>`<th>${h}</th>`).join("");
  const rows=[];
  for(const reg of REGS){
    const S=S1[reg];
    const fed=Object.keys(S).filter(k=>k.startsWith("federated:")&&!k.includes("round_mean"));
    const ft=Object.keys(S).filter(k=>k.startsWith("finetune:"));
    for(const [grp,keys] of [["federated/base",fed],["fine-tune",ft]]){
      if(!keys.length)continue;
      const td=keys.reduce((s,k)=>s+S[k].tail_drop,0)/keys.length;
      const fl=keys.reduce((s,k)=>s+S[k].final,0)/keys.length;
      rows.push([`${reg} · ${grp}`,"1 — generator",keys.length,"real",fl.toExponential(1),td,td<3]);
    }
  }
  for(const f of FAM_ORDER.filter(f=>S2[f]))
    rows.push([f.replace("tstr:",""),"2 — classifier",S2[f].n_classifiers,
      S2[f].records,S2[f].mean[9].toFixed(4),S2[f].tail_drop,S2[f].tail_drop<3]);
  $("tbody").innerHTML=rows.map(r=>
    `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td>`+
    `<td class="n">${r[4]}</td><td class="n">${f2(r[5])}%</td>`+
    `<td class="${r[6]?'ok':'bad'}">${r[6]?'settled':'still falling'}</td></tr>`).join("");
}

(function verdict(){
  const syn=["tstr:centralized","tstr:fedavg"].filter(f=>S2[f]);
  const real=["real_local","real_pooled_budgeted"].filter(f=>S2[f]);
  const m=a=>a.reduce((s,f)=>s+S2[f].tail_drop,0)/a.length;
  $("verdict").innerHTML=`<h3>The generators finished. Half the classifiers did not.</h3>`+
    `<p>Stage 1 loss is flat by the end of training, so the synthetic data reflects `+
    `generators that had converged. Stage 2 is uneven: the synthetic-trained classifiers `+
    `settled (${f2(m(syn))}% drop over their last three epochs) while the real-data `+
    `baselines were still descending steeply (${f2(m(real))}%). Since those baselines are `+
    `the bar the synthetic arms must clear, the comparison currently favours synthetic — `+
    `more epochs would lift the baselines and leave the synthetic arms where they are.</p>`;
})();

drawS1(); drawS2(); drawTable();
addEventListener("resize",()=>{drawS1();drawS2();});
</script>
