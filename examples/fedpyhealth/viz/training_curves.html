const R = DATA.runs, SIZES = DATA.meta.sizes || {};
const $ = i => document.getElementById(i);
const SVGNS = "http://www.w3.org/2000/svg";
const cssv = n => getComputedStyle(document.documentElement)
                    .getPropertyValue(n).trim() || "#888";

let show = "both";
const hidden = new Set();

const names = Object.keys(R).sort();
names.forEach(n => $("run").insertAdjacentHTML("beforeend",
  `<option value="${n}">${n}${R[n].complete ? "" : "  (running)"}</option>`));
// Open on a run that actually has multiple hospitals. centralized sorts first
// alphabetically but trains ONE pooled model, so it would show a single line on
// a page whose whole point is comparing sites.
$("run").value = names.find(n => Object.keys(R[n].series).length > 1) || names[0];

// Rank hospitals by training size so colour carries the high/low split.
function ordered(keys) {
  return keys.slice().sort((a, b) =>
    (SIZES[b] || 0) - (SIZES[a] || 0) || a.localeCompare(b, undefined, {numeric: true}));
}
const HI = ["--hi1", "--hi2", "--hi3", "--hi4"];
const LO = ["--lo1", "--lo2", "--lo3", "--lo4"];
function colourOf(keys) {
  const ord = ordered(keys), out = {}, half = Math.ceil(ord.length / 2);
  ord.forEach((k, i) => {
    out[k] = i < half ? HI[Math.min(i, 3)] : LO[Math.min(i - half, 3)];
  });
  return out;
}

const W = 1000, H = 430, P = {t: 16, r: 22, b: 46, l: 68};
let LAST = null;

function draw() {
  const r = R[$("run").value], s = r.series;
  const keys = ordered(Object.keys(s)).filter(k => !hidden.has(k));
  const col = colourOf(Object.keys(s));

  // fedavg_ft runs a per-hospital fine-tuning phase AFTER the last aggregation,
  // logged separately (loss_ft / loss_val_ft). It belongs on the same timeline
  // rather than in its own chart: the regime's budget is one continuous run of
  // n_rounds*local_epochs shared passes followed by ft_epochs local ones, and
  // the whole point of the arm is what each site does once it stops averaging.
  // ftAt marks the handover so the shared and personalized halves stay legible.
  const lines = [];
  let ftAt = null;
  for (const k of keys) {
    const tr = s[k].ft ? (s[k].train || []).concat(s[k].ft) : s[k].train;
    const va = s[k].val_ft ? (s[k].val || []).concat(s[k].val_ft) : s[k].val;
    if (s[k].ft && s[k].train) ftAt = (s[k].train.length) / (tr.length - 1 || 1);
    if (show !== "val" && tr) lines.push({k, kind: "train", v: tr, css: col[k]});
    if (show !== "train" && va) lines.push({k, kind: "val", v: va, css: col[k]});
  }
  const all = lines.flatMap(l => l.v).filter(v => v > 0);
  const svg = $("plot");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (!all.length) { svg.innerHTML = ""; LAST = null; return; }

  const lo = Math.min(...all), hi = Math.max(...all);
  const l0 = Math.log10(lo), l1 = Math.log10(hi);
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  // Each series is normalised to its own length: train logs once per local
  // epoch, a pooled val once per round, so a shared x would squash the shorter.
  const X = (i, n) => P.l + (n < 2 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = v => P.t + ih - ((Math.log10(Math.max(v, lo)) - l0) / ((l1 - l0) || 1)) * ih;

  let g = "";
  for (let e = Math.floor(l0); e <= Math.ceil(l1); e++) {
    const val = Math.pow(10, e);
    if (val < lo * 0.9 || val > hi * 1.1) continue;
    g += `<line class="grid" x1="${P.l}" x2="${P.l + iw}" y1="${Y(val)}" y2="${Y(val)}"/>`;
    g += `<text class="tick" x="${P.l - 9}" y="${Y(val) + 4}" text-anchor="end">`
       + `${val < 0.001 ? val.toExponential(0) : val}</text>`;
  }
  if (ftAt != null) {
    const x = P.l + ftAt * iw;
    g += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${P.t}" y2="${P.t + ih}" `
       + `stroke="${cssv('--stop')}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    g += `<text class="lab" x="${(x + 5).toFixed(1)}" y="${P.t + 12}" `
       + `fill="${cssv('--stop')}">fine-tuning starts</text>`;
  }
  for (const l of lines) {
    const d = l.v.map((v, i) => `${i ? "L" : "M"}${X(i, l.v.length).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    // Validation is the line you read; train is context behind it.
    g += `<path d="${d}" fill="none" stroke="${cssv(l.css)}" `
       + `stroke-width="${l.kind === "val" ? 2.2 : 1.3}" `
       + `stroke-opacity="${l.kind === "val" ? 1 : 0.45}" `
       + `${l.kind === "train" ? 'stroke-dasharray="none"' : ""} `
       + `stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  for (const k of keys) {
    const d = s[k];
    if (show === "train" || d.best_idx == null || !d.val) continue;
    g += `<circle cx="${X(d.best_idx, d.val.length).toFixed(1)}" `
       + `cy="${Y(d.val[d.best_idx]).toFixed(1)}" r="3.8" fill="${cssv(col[k])}" `
       + `stroke="${cssv('--panel')}" stroke-width="1.6"/>`;
  }
  g += `<line class="axis" x1="${P.l}" x2="${P.l + iw}" y1="${P.t + ih}" y2="${P.t + ih}"/>`;
  g += `<line class="axis" x1="${P.l}" x2="${P.l}" y1="${P.t}" y2="${P.t + ih}"/>`;
  const maxN = Math.max(...lines.map(l => l.v.length));
  for (const f of [0, .25, .5, .75, 1]) {
    const i = Math.round(f * (maxN - 1));
    g += `<text class="tick" x="${P.l + f * iw}" y="${P.t + ih + 18}" text-anchor="middle">${i}</text>`;
  }
  g += `<text class="lab" x="${P.l + iw / 2}" y="${H - 8}" text-anchor="middle">`
     + `progress through training (each series over its own length)</text>`;
  g += `<text class="lab" transform="translate(18,${P.t + ih / 2}) rotate(-90)" `
     + `text-anchor="middle">loss (log)</text>`;
  g += `<rect id="hit" x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  svg.innerHTML = g;
  LAST = {lines, X, Y, iw, col};
  svg.querySelector("#hit").addEventListener("mousemove", onMove);
  svg.querySelector("#hit").addEventListener("mouseleave", () => $("tip").classList.remove("on"));

  renderLegend(s, col);

}

function onMove(ev) {
  if (!LAST) return;
  const svg = $("plot"), box = svg.getBoundingClientRect(), ch = $("chart").getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, ((ev.clientX - box.left) / box.width * W - P.l) / LAST.iw));
  const rows = LAST.lines.filter(l => l.kind === "val").map(l => {
    const i = Math.round(frac * (l.v.length - 1));
    return `${l.k}: ${l.v[i].toExponential(2)}`;
  });
  if (!rows.length) return;
  const tip = $("tip");
  tip.innerHTML = rows.join("<br>");
  tip.classList.add("on");
  const px = ev.clientX - ch.left + 14;
  tip.style.left = Math.min(px, ch.width - tip.offsetWidth - 8) + "px";
  tip.style.top = (ev.clientY - ch.top + 10) + "px";
}

function renderLegend(s, col) {
  const ord = ordered(Object.keys(s)), half = Math.ceil(ord.length / 2);
  let h = "";
  ord.forEach((k, i) => {
    if (i === 0) h += `<span class="grp">larger sites</span>`;
    if (i === half) h += `<span class="grp">smaller sites</span>`;
    const on = !hidden.has(k);
    h += `<button class="chip" data-h="${k}" aria-pressed="${on}">`
       + `<span class="sw" style="background:${cssv(col[k])}"></span>${k}`
       + (SIZES[k] ? `<span class="n">${SIZES[k]}</span>` : "") + `</button>`;
  });
  $("legend").innerHTML = h;
  $("legend").querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => {
      const k = b.dataset.h;
      hidden.has(k) ? hidden.delete(k) : hidden.add(k);
      draw();
    }));
}

function renderNote(r, s, keys) {
  const pooled = r.val_scope === "pooled";
  const hasFt = keys.some(k => s[k].ft);
  const noVal = keys.filter(k => s[k].best_idx == null);
  const clean = keys.filter(k => s[k].stopped_after_best > 0);
  $("note").innerHTML = `<b>${$("run").value}</b> — ${keys.length} hospitals. `
    + (pooled && hasFt
      ? `Validation is <b>cohort-wide</b> during the federated rounds — one global model serves every site, so the same val line is drawn for all of them and only the train curves differ. After the dashed rule each hospital <b>fine-tunes its own copy</b> on its own data, and from there both curves are that hospital's alone. `
      : "")
    + (pooled && !hasFt
      ? `This regime trains one global model, so validation is a single <b>cohort-wide</b> curve over all val patients — the same line is drawn for every hospital, and only the train curves differ. `
      : "")
    + (clean.length && !pooled
      ? `${clean.length} early-stopped, training past their best before giving up. ` : "")
    + (noVal.length && !pooled
      ? `${noVal.length} (${noVal.join(", ")}) have no validation curve — their val fold is under the 30-patient threshold, so they run the full budget instead of stopping. `
      : "");
}

$("show").querySelectorAll("button").forEach(b =>
  b.addEventListener("click", () => {
    show = b.dataset.show;
    $("show").querySelectorAll("button").forEach(o =>
      o.setAttribute("aria-pressed", String(o === b)));
    draw();
  }));
$("run").addEventListener("change", () => { hidden.clear(); draw(); });
addEventListener("resize", draw);
draw();
</script>
