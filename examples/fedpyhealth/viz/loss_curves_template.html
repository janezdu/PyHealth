<title>[ehr] Did anything finish training?</title>
<style>
  :root{
    --ground:#fbfbfa; --panel:#fff; --ink:#15181b; --ink-2:#4d565f; --ink-3:#818c97;
    --rule:#e3e7ea; --rule-soft:#eff2f4; --grid:#e8ebee;
    --g1:#1b6ca8; --g2:#3d8fc4; --g3:#6bb0d8; --g4:#a3cee6;
    --real:#a8452c; --warn:#b8860b; --ok:#1f7a4d;
    --shadow:0 1px 2px #15181b0f,0 8px 24px #15181b0a;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0f1214; --panel:#171b1e; --ink:#e9eef2; --ink-2:#a6b2bc; --ink-3:#6d7883;
    --rule:#262c31; --rule-soft:#1d2226; --grid:#222830;
    --g1:#5aa8dc; --g2:#7cc0e8; --g3:#a0d2ef; --g4:#c4e4f6;
    --real:#e08163; --warn:#e0a63f; --ok:#4fbe86;
    --shadow:0 1px 2px #00000040,0 8px 24px #00000030;}}
  :root[data-theme="dark"]{
    --ground:#0f1214; --panel:#171b1e; --ink:#e9eef2; --ink-2:#a6b2bc; --ink-3:#6d7883;
    --rule:#262c31; --rule-soft:#1d2226; --grid:#222830;
    --g1:#5aa8dc; --g2:#7cc0e8; --g3:#a0d2ef; --g4:#c4e4f6;
    --real:#e08163; --warn:#e0a63f; --ok:#4fbe86;
    --shadow:0 1px 2px #00000040,0 8px 24px #00000030;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font:400 15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:46px 26px 76px;display:flex;flex-direction:column;gap:30px}
  h1{font:400 33px/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
     margin:0;letter-spacing:-.01em;text-wrap:balance}
  h2{font:600 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.09em;
     text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
  .lede{margin:0;max-width:66ch;color:var(--ink-2);font-size:16px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .verdict{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--warn);
    border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
  .verdict h3{margin:0 0 7px;font:600 17px/1.3 ui-sans-serif,system-ui,sans-serif}
  .verdict p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:76ch}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
    padding:20px;box-shadow:var(--shadow)}
  .ctl{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
  .ctl label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:5px}
  select{font:inherit;font-size:14px;padding:6px 10px;background:var(--panel);color:var(--ink);
    border:1px solid var(--rule);border-radius:7px}
  select:focus-visible,th:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--rule);stroke-width:1.2}
  .tick{fill:var(--ink-3);font-size:11px;font-family:ui-monospace,Menlo,monospace}
  .lab{fill:var(--ink-2);font-size:12px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:13px;color:var(--ink-2)}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:7px;vertical-align:3px}
  .note{color:var(--ink-2);font-size:13.5px;max-width:78ch;margin:12px 0 0;padding-left:12px;
    border-left:2px solid var(--rule)}
  .note b{color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--panel)}
  .tw{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
  th,td{padding:8px 13px;text-align:right;white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);font:600 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule)}
  th:first-child,td:first-child{text-align:left}
  tbody tr{border-top:1px solid var(--rule-soft)}
  td.n{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .ok{color:var(--ok);font-weight:600}.bad{color:var(--real);font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:640px){.wrap{padding:28px 15px 56px}h1{font-size:26px}}
</style>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:9px">
    <h1>Did anything finish training?</h1>
    <p class="lede" id="lede"></p>
  </header>
  <div class="verdict" id="verdict"></div>

  <section>
    <h2>Stage 1 — the generators (trained on real records)</h2>
    <div class="card">
      <div class="ctl"><div><label for="s1reg">Regime</label><select id="s1reg"></select></div></div>
      <svg id="s1" role="img" aria-label="Generator training loss per hospital"></svg>
      <div class="legend" id="s1leg"></div>
      <p class="note" id="s1note"></p>
    </div>
  </section>

  <section>
    <h2>Stage 2 — the downstream classifiers (trained on synthetic)</h2>
    <div class="card">
      <svg id="s2" role="img" aria-label="Classifier training loss by arm family"></svg>
      <div class="legend" id="s2leg"></div>
      <p class="note" id="s2note"></p>
    </div>
  </section>

  <section>
    <h2>Convergence, both stages</h2>
    <div class="tw"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  </section>
</div>
<script>
const DATA = "__DATA__";
const S1=DATA.stage1, S2=DATA.stage2, M=DATA.meta;
const $=i=>document.getElementById(i);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);
  for(const k in a)e.setAttribute(k,a[k]);return e;};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888";
const f2=v=>v==null||v!==v?"—":v.toFixed(2);

// Synthetic arms take the blue ramp; real-data baselines take the warm accent,
// because the whole point of the second panel is that those two groups did NOT
// finish training at the same rate.
const FAM_COLOR={"tstr:centralized":"--g1","tstr:fedavg":"--g2",
  "tstr:fedavg_ft":"--g3","tstr:local":"--g4",
  "real_local":"--real","real_pooled":"--warn","real_pooled_budgeted":"--warn"};
const FAM_ORDER=["tstr:centralized","tstr:fedavg","tstr:fedavg_ft","tstr:local",
  "real_pooled","real_pooled_budgeted","real_local"];

$("lede").textContent=
  `Two separate trainings sit in this pipeline: generators that learn from real `+
  `patients, and classifiers that learn from the synthetic patients those `+
  `generators produce. "Converged" means the loss stopped falling — if it was `+
  `still dropping when training ended, the model you measured is not the model `+
  `you would have got.`;

/* ---------- shared plotting ---------- */
function plot(svg, series, opts){
  const W=1000,H=opts.h||360,P={t:16,r:opts.r||150,b:46,l:64};
  const all=series.flatMap(s=>s.v).filter(v=>v>0);
  const lo=Math.min(...all), hi=Math.max(...all);
  const nx=Math.max(...series.map(s=>s.v.length));
  const l0=Math.log10(lo), l1=Math.log10(hi);
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const X=i=>P.l+(nx<2?iw/2:i/(nx-1)*iw);
  const Y=v=>P.t+ih-(Math.log10(Math.max(v,lo))-l0)/(l1-l0||1)*ih;
  let g="";
  for(let e=Math.floor(l0);e<=Math.ceil(l1);e++){
    const val=Math.pow(10,e); if(val<lo*0.9||val>hi*1.1)continue;
    g+=`<line class="grid" x1="${P.l}" x2="${P.l+iw}" y1="${Y(val)}" y2="${Y(val)}"/>`;
    g+=`<text class="tick" x="${P.l-8}" y="${Y(val)+4}" text-anchor="end">${val<0.001?val.toExponential(0):val}</text>`;
  }
  if(opts.hline!=null&&opts.hline>=lo&&opts.hline<=hi){
    g+=`<line x1="${P.l}" x2="${P.l+iw}" y1="${Y(opts.hline)}" y2="${Y(opts.hline)}" `+
       `stroke="${cssv('--warn')}" stroke-width="1.4" stroke-dasharray="7 4" stroke-opacity=".7"/>`;
    g+=`<text class="tick" x="${P.l+iw+8}" y="${Y(opts.hline)+4}" fill="${cssv('--warn')}">${opts.hlabel}</text>`;
  }
  for(const s of series){
    const d=s.v.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    g+=`<path d="${d}" fill="none" stroke="${cssv(s.css)}" stroke-width="${s.w||1.8}" `+
       `stroke-opacity="${s.o==null?1:s.o}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.label){
      const ly=Y(s.v[s.v.length-1]);
      g+=`<text class="tick" x="${P.l+iw+8}" y="${ly+4}" fill="${cssv(s.css)}">${s.label}</text>`;
    }
  }
  g+=`<line class="axis" x1="${P.l}" x2="${P.l+iw}" y1="${P.t+ih}" y2="${P.t+ih}"/>`;
  g+=`<line class="axis" x1="${P.l}" x2="${P.l}" y1="${P.t}" y2="${P.t+ih}"/>`;
  const ticks=nx<=12?[...Array(nx).keys()]:[0,Math.floor(nx/4),Math.floor(nx/2),Math.floor(3*nx/4),nx-1];
  for(const i of ticks)
    g+=`<text class="tick" x="${X(i).toFixed(1)}" y="${P.t+ih+18}" text-anchor="middle">${i+1}</text>`;
  g+=`<text class="lab" x="${P.l+iw/2}" y="${H-8}" text-anchor="middle">${opts.xlab}</text>`;
  g+=`<text class="lab" transform="translate(16,${P.t+ih/2}) rotate(-90)" text-anchor="middle">training loss (log)</text>`;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=g;
}

/* ---------- stage 1 ---------- */
const REGS=Object.keys(S1);
REGS.forEach(r=>$("s1reg").insertAdjacentHTML("beforeend",`<option value="${r}">${r}</option>`));
$("s1reg").value=REGS.includes("fedavg")?"fedavg":REGS[0];
function drawS1(){
  const reg=$("s1reg").value, S=S1[reg];
  const keys=Object.keys(S).filter(k=>!k.includes("round_mean"));
  const ramp=["--g1","--g2","--g3","--g4","--real","--warn","--ok","--ink-3"];
  const series=keys.map((k,i)=>({v:S[k].v,css:ramp[i%ramp.length],
    label:k.split(":")[1],w:k.startsWith("finetune")?2.4:1.6,
    o:k.startsWith("finetune")?1:.85}));
  const mean=S["federated:round_mean"];
  if(mean) series.push({v:mean.v,css:"--ink",w:2.6,label:"round mean"});
  plot($("s1"),series,{xlab:reg==="local"?"epoch":"local epoch (across rounds)",h:340});
  const drops=keys.map(k=>S[k].tail_drop);
  const worst=Math.max(...drops);
  $("s1note").innerHTML=`<b>${reg}</b>: over the final fifth of training the loss `+
    `still fell by ${f2(Math.min(...drops))}–${f2(worst)}% depending on the site. `+
    (worst<3?`Effectively flat — the generators finished learning.`
           :`The steepest site was still descending, so this regime had not fully settled.`)+
    (S["finetune:420"]?` Thick lines are the per-hospital fine-tuning phase, which runs after the federated rounds.`:``);
  $("s1leg").innerHTML=series.map(s=>
    `<span><i style="background:${cssv(s.css)}"></i>${s.label||""}</span>`).join("");
}
$("s1reg").addEventListener("change",drawS1);

/* ---------- stage 2 ---------- */
function drawS2(){
  const fams=FAM_ORDER.filter(f=>S2[f]);
  const series=fams.map(f=>({v:S2[f].mean,css:FAM_COLOR[f]||"--ink-3",label:f.replace("tstr:",""),w:2.4}));
  plot($("s2"),series,{xlab:"epoch",h:330,hline:M.base_rate_bce,hlabel:"base-rate loss"});
  $("s2leg").innerHTML=fams.map(f=>
    `<span><i style="background:${cssv(FAM_COLOR[f]||'--ink-3')}"></i>${f.replace("tstr:","")} `+
    `<span class="mono">(${S2[f].n_classifiers})</span></span>`).join("");
  const syn=fams.filter(f=>f.startsWith("tstr:")), real=fams.filter(f=>!f.startsWith("tstr:"));
  const m=a=>a.reduce((s,f)=>s+S2[f].tail_drop,0)/a.length;
  $("s2note").innerHTML=`<b>The synthetic arms finished; the real baselines did not.</b> `+
    `Over their last three epochs the synthetic arms fell ${f2(m(syn))}% on average, `+
    `the real-data baselines ${f2(m(real))}%. Training was cut at ${M.stage2_epochs} epochs for all of `+
    `them, so the baselines were stopped mid-descent — and they are exactly what the `+
    `synthetic arms are being compared against, which biases the comparison toward `+
    `synthetic. The dashed line is the loss of a model that simply predicts the base `+
    `rate; everything sits below it, so nothing collapsed outright.`;
}

/* ---------- table ---------- */
function drawTable(){
  $("thead").innerHTML=["series","stage","curves","records","final loss","tail drop","verdict"]
    .map(h=>`<th>${h}</th>`).join("");
  const rows=[];
  for(const reg of REGS){
    const S=S1[reg];
    const fed=Object.keys(S).filter(k=>k.startsWith("federated:")&&!k.includes("round_mean"));
    const ft=Object.keys(S).filter(k=>k.startsWith("finetune:"));
    for(const [grp,keys] of [["federated/base",fed],["fine-tune",ft]]){
      if(!keys.length)continue;
      const td=keys.reduce((s,k)=>s+S[k].tail_drop,0)/keys.length;
      const fl=keys.reduce((s,k)=>s+S[k].final,0)/keys.length;
      rows.push([`${reg} · ${grp}`,"1 — generator",keys.length,"real",fl.toExponential(1),td,td<3]);
    }
  }
  for(const f of FAM_ORDER.filter(f=>S2[f]))
    rows.push([f.replace("tstr:",""),"2 — classifier",S2[f].n_classifiers,
      S2[f].records,S2[f].mean[9].toFixed(4),S2[f].tail_drop,S2[f].tail_drop<3]);
  $("tbody").innerHTML=rows.map(r=>
    `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td>`+
    `<td class="n">${r[4]}</td><td class="n">${f2(r[5])}%</td>`+
    `<td class="${r[6]?'ok':'bad'}">${r[6]?'settled':'still falling'}</td></tr>`).join("");
}

(function verdict(){
  const syn=["tstr:centralized","tstr:fedavg"].filter(f=>S2[f]);
  const real=["real_local","real_pooled_budgeted"].filter(f=>S2[f]);
  const m=a=>a.reduce((s,f)=>s+S2[f].tail_drop,0)/a.length;
  $("verdict").innerHTML=`<h3>The generators finished. Half the classifiers did not.</h3>`+
    `<p>Stage 1 loss is flat by the end of training, so the synthetic data reflects `+
    `generators that had converged. Stage 2 is uneven: the synthetic-trained classifiers `+
    `settled (${f2(m(syn))}% drop over their last three epochs) while the real-data `+
    `baselines were still descending steeply (${f2(m(real))}%). Since those baselines are `+
    `the bar the synthetic arms must clear, the comparison currently favours synthetic — `+
    `more epochs would lift the baselines and leave the synthetic arms where they are.</p>`;
})();

drawS1(); drawS2(); drawTable();
addEventListener("resize",()=>{drawS1();drawS2();});
</script>
